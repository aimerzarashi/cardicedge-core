# make gen-orm（開発用の core コンテナの中で、マイグレーション済みの core-db から生成する）
output = "models"
pkgname = "models"
wipe = true
no-tests = true

[psql]
  dbname = "core_studio"
  schema = "public"
  host = "core-db"
  port = 5432
  user = "core_user"
  pass = "core_password"
  sslmode = "disable"

# 既定の変換では quotas の単数形が quotas のままで、型名（DomainQuotas）が行の型と一覧の型で重なるため
[inflections.singular]
  quotas = "quota"
