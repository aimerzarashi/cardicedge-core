# make gen-api
schema:
  - ./*.graphqls

exec:
  package: graphql
  layout: single-file
  filename: ./generated.go

model:
  filename: ./model/models_gen.go
  package: model

resolver:
  package: graphql
  layout: follow-schema
  dir: .
  filename_template: "{name}.resolvers.go"
  # preserve_resolver は付けない（studio の gqlgen.yml と同じ。core#11）

models:
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID
  # starterGrant は resolver で返す（read model players から、返すときに読むため）
  Player:
    fields:
      starterGrant:
        resolver: true
