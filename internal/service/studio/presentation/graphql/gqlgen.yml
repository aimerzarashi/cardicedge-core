# make gen-api
schema:
  - ./*.graphqls

exec:
  package: graphql
  layout: single-file
  filename: ./generated.go

model:
  filename: ./model/models_gen.go
  package: model

resolver:
  package: graphql
  layout: follow-schema
  dir: .
  filename_template: "{name}.resolvers.go"
  # preserve_resolver は付けない（参照の api は付けていた）。付けると、すでにあるリゾルバーのファイルを丸ごと書き換えないため、
  # 操作を足しても雛形ができず、消しても古い実装が黙って残る。外しても既存の実装は残る（core#11 で確かめた）

models:
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID
  DateTime:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  # cards は resolver で返す（カード名をデータローダーで引いてから並べるため。core#24）
  PresetDeck:
    model:
      - gitlab.com/aimerzarashi/diecardomain/core/internal/service/studio/presentation/graphql/model.PresetDeck
    fields:
      cards:
        resolver: true
  GrantDeck:
    model:
      - gitlab.com/aimerzarashi/diecardomain/core/internal/service/studio/presentation/graphql/model.GrantDeck
    fields:
      cards:
        resolver: true
  # decks は resolver で返す（公開 ID から NPC のデッキを引いてから並べるため。core#87）
  NpcAvatar:
    model:
      - gitlab.com/aimerzarashi/diecardomain/core/internal/service/studio/presentation/graphql/model.NpcAvatar
    fields:
      decks:
        resolver: true
      mindsets:
        resolver: true
  # grantDecks・unlockBoards は resolver で返す（公開 ID から配布デッキ・ボードを引いてから並べるため。core#92）
  StarterSet:
    model:
      - gitlab.com/aimerzarashi/diecardomain/core/internal/service/studio/presentation/graphql/model.StarterSet
    fields:
      grantDecks:
        resolver: true
      unlockBoards:
        resolver: true
      unlockNpcAvatars:
        resolver: true
  NpcDeck:
    model:
      - gitlab.com/aimerzarashi/diecardomain/core/internal/service/studio/presentation/graphql/model.NpcDeck
    fields:
      cards:
        resolver: true
