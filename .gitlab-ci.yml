# MR・main への push・タグでだけ実行する（同じ変更で二重に走らせない）
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - build
  - release
  - deploy

variables:
  DOCKER_VERSION: "29.9.2"
  # Docker Hub の配布先（タグのパイプラインで push する）
  DOCKERHUB_IMAGE: diecardomain/core
  DOCKERHUB_MIGRATE_IMAGE: diecardomain/core-migrate
  # local/migrate/Dockerfile の FROM と揃える
  ATLAS_VERSION: "1.3.6"

# lint / test は main に向かう MR（マイルストーンの MR）で実行する。main への push では実行しない（直前の MR で同じ中身を
# 確かめているため。マイルストーンのブランチは main に rebase してから MR にする。core#30）。
# マイルストーンのブランチに向かう Issue の MR では手動にし、ふだんは手元の make lint・make test で確かめる（共有 Runner の時間を
# Issue ごとに使わないため）。CI の手順を変えたとき等、CI で確かめたいときだけ手で動かす。手動のジョブだけのパイプラインは skipped に
# なり、「スキップされたパイプラインを成功とみなす」の設定でマージできる（「パイプラインが成功する必要がある」の設定は、main に
# 向かう MR の歯止めとして残す）。rules の中の when: manual は allow_failure が既定で false になり、パイプラインが blocked で
# 止まるため、true を明示する。前は何もしない手動のジョブ（issue-mr）を置いていたが、CI で確かめたいときに使えなかった（core#31・core#33）
.on-mr:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# イメージのビルドに使う Docker in Docker
.docker:
  image: docker:${DOCKER_VERSION}
  services:
    - docker:${DOCKER_VERSION}-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"

# make lint と同じ（gofmt の違反検出、go vet、staticcheck、カスタムリンター、gqlgen の生成し忘れの検査、migrations の検査）
lint:
  stage: test
  extends: .on-mr
  image: golang:1.27.3-bookworm
  variables:
    # 分岐点のコミットとの差分をとるため、全履歴を取得する（浅い clone だと分岐点が無いことがある）
    GIT_DEPTH: 0
  script:
    - files=$(gofmt -l .); if [ -n "$files" ]; then echo "gofmt:"; echo "$files"; exit 1; fi
    - go vet ./...
    - go tool staticcheck ./...
    - go run ./tools/linter ./...
    - scripts/check-gen-api.sh
    # 適用済みのマイグレーションの変更・削除・改名も検査する。比較元は対象ブランチ（main）との分岐点
    - scripts/check-migrations.sh $CI_MERGE_REQUEST_DIFF_BASE_SHA

# make test と同じ。DB は CI のサービスで起動し、go test の前に Atlas で migrations を適用する（テストが使う core_test と、複製するテンプレートの core_template）
test:
  stage: test
  extends: .on-mr
  image: golang:1.27.3-bookworm
  services:
    - name: postgres:18.6
      alias: core-db
  variables:
    POSTGRES_USER: core_user
    POSTGRES_PASSWORD: core_password
    POSTGRES_DB: core_test
    TEST_DB_DSN: "host=core-db port=5432 user=core_user password=core_password dbname=core_test sslmode=disable"
  script:
    - curl -sSfL -o /usr/local/bin/atlas "https://release.ariga.io/atlas/atlas-community-linux-amd64-v${ATLAS_VERSION}"
    - chmod +x /usr/local/bin/atlas
    - atlas migrate apply --dir file://migrations --url "postgres://core_user:core_password@core-db:5432/core_test?sslmode=disable"
    # 種別の行はマイグレーションで入れず、コードの一覧から入れる（core は起動時に入れるが、テストの DB は core を起動しないため。core#33）
    - go run ./tools/synctypes -env TEST_DB_DSN
    # ユニットテストが複製するテンプレート（make test の migrate-template と同じ）
    - go run ./tools/createdb -env TEST_DB_DSN -name core_template
    - atlas migrate apply --dir file://migrations --url "postgres://core_user:core_password@core-db:5432/core_template?sslmode=disable"
    - go run ./tools/synctypes -env TEST_DB_DSN -dbname core_template
    - go test ./... -race

# MR の確認用イメージ（手動）。アプリとマイグレーション用イメージを GitLab Container Registry に mr-<MR番号> で push する
build-mr:
  stage: build
  extends: .docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  # lint・test（migrations の検査を含む）が通らないうちは、確認用イメージも作らせない
  needs: [lint, test]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMAGE="$CI_REGISTRY_IMAGE:mr-$CI_MERGE_REQUEST_IID"
    - docker build --pull --build-arg BUILD_VERSION="mr-$CI_MERGE_REQUEST_IID" -t "$IMAGE" -f .build/Dockerfile .
    - docker push "$IMAGE"
    # マイグレーション用イメージ
    - MIGRATE_IMAGE="$CI_REGISTRY_IMAGE/migrate:mr-$CI_MERGE_REQUEST_IID"
    - docker build --pull -t "$MIGRATE_IMAGE" -f local/migrate/Dockerfile .
    - docker push "$MIGRATE_IMAGE"
  after_script:
    - docker logout "$CI_REGISTRY"

# main へのマージで semantic-release を実行し、タグ（v*）と GitLab リリースを作る。
# リリース対象のコミット（feat / fix 等）が無ければ何もしない。CHANGELOG.md は保存しない
release:
  stage: release
  image: node:26.13.0-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # 前回のリリースタグからの履歴を読むため、全履歴を取得する
    GIT_DEPTH: 0
  script:
    - npm install --prefix /tmp/semantic-release --no-save --no-audit --no-fund
      semantic-release@25.0.9
      @semantic-release/commit-analyzer@13.0.1
      @semantic-release/release-notes-generator@14.1.1
      @semantic-release/gitlab@13.3.3
    - /tmp/semantic-release/node_modules/.bin/semantic-release

# semantic-release が作ったタグのパイプラインで、そのタグのアプリとマイグレーション用イメージを Docker Hub に配布する
deploy:
  stage: deploy
  extends: .docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build --pull --build-arg BUILD_VERSION="$CI_COMMIT_TAG" -t "$DOCKERHUB_IMAGE:$CI_COMMIT_TAG" -t "$DOCKERHUB_IMAGE:latest" -f .build/Dockerfile .
    - docker push "$DOCKERHUB_IMAGE:$CI_COMMIT_TAG"
    - docker push "$DOCKERHUB_IMAGE:latest"
    # マイグレーション用イメージ（アプリと同じタグ。本番ではアプリより先にジョブとして実行する）
    - docker build --pull -t "$DOCKERHUB_MIGRATE_IMAGE:$CI_COMMIT_TAG" -t "$DOCKERHUB_MIGRATE_IMAGE:latest" -f local/migrate/Dockerfile .
    - docker push "$DOCKERHUB_MIGRATE_IMAGE:$CI_COMMIT_TAG"
    - docker push "$DOCKERHUB_MIGRATE_IMAGE:latest"
  after_script:
    - docker logout
