# game / studio のテスト用に、使い捨ての core と DB を起動する。
# 利用側の compose から include し、利用側のプロジェクト名で起動する（開発用の core とは別のコンテナ・ネットワーク・DB になる）。
# ホストにポートを公開せず、共有ネットワーク（diecardomain-game・diecardomain-studio）にも参加しない
services:
  core:
    build:
      context: .
      dockerfile: .build/Dockerfile
    environment:
      # studio 用・game 用の DB（同じサーバーの別の DB。core#33）
      STUDIO_DB_DSN: "host=core-db port=5432 user=core_user password=core_password dbname=core_studio sslmode=disable"
      GAME_DB_DSN: "host=core-db port=5432 user=core_user password=core_password dbname=core_game sslmode=disable"
      # studio（better-auth）の JWT の検証。JWKS は studio-envoy を通して取る（studio#11: studio には envoy を通してしか届かない）。
      # iss・aud は studio の JWT_ISSUER・JWT_AUDIENCE と一致させる。studio が動いていなくても起動は止まらない（最初の JWT が来たときに取り直す）
      STUDIO_JWKS_URL: http://studio-envoy:10000/api/auth/jwks
      STUDIO_JWT_ISSUER: diecardomain-studio
      STUDIO_JWT_AUDIENCE: diecardomain-core
      # game の JWT（core#34）。JWKS は studio と同じく、game の envoy を通して取る
      GAME_JWKS_URL: http://game-envoy:10000/api/auth/jwks
      GAME_JWT_ISSUER: diecardomain-game
      GAME_JWT_AUDIENCE: diecardomain-core
      STUDIO_INITIAL_OPERATOR_EMAIL: operator@example.com
      # トレースとログの送り先（開発の core の compose.yaml の otel-lgtm。core#75）。受け手が動いていなくても core は普通に動く
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: core
    # 受け手へ届ける口（core#74）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      core-migrate-studio:
        condition: service_completed_successfully
      core-migrate-game:
        condition: service_completed_successfully

  # 未適用のマイグレーションを適用して終了する（リリースと同じマイグレーション用イメージ）。studio 用・game 用の DB に同じものを流す
  core-migrate-studio:
    build:
      context: .
      dockerfile: local/migrate/Dockerfile
    environment:
      DATABASE_URL: "postgres://core_user:core_password@core-db:5432/core_studio?sslmode=disable"
    depends_on:
      core-db:
        condition: service_healthy

  core-migrate-game:
    build:
      context: .
      dockerfile: local/migrate/Dockerfile
    environment:
      DATABASE_URL: "postgres://core_user:core_password@core-db:5432/core_game?sslmode=disable"
    depends_on:
      core-db:
        condition: service_healthy

  core-db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core_password
      POSTGRES_DB: core_studio
    volumes:
      - ./local/core-db:/docker-entrypoint-initdb.d:ro
    # データはコンテナ内の一時領域に置き、終了とともに破棄する
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d core_studio"]
      interval: 2s
      timeout: 5s
      retries: 30
